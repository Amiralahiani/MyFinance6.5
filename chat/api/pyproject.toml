[project]
name = "myfinance-orchestrator"
version = "0.1.0"
description = "Reliable request routing for financial-statement analysis."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "groq>=0.32",
    "httpx>=0.27",
    "myfinance-agent-docs",
    "myfinance-contracts",
    "openai>=1.33",
    "pyyaml>=6.0",
    "uvicorn[standard]>=0.30",
]

[tool.uv.sources]
myfinance-agent-docs = { workspace = true }
myfinance-contracts = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/myfinance_orchestrator"]
