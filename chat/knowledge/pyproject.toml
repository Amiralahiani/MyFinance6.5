[project]
name = "myfinance-agent-docs"
version = "0.1.0"
description = "Bank-report catalogue and document agent."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "myfinance-contracts",
    "pypdf>=5.0",
    "uvicorn[standard]>=0.30",
]

[tool.uv.sources]
myfinance-contracts = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/myfinance_agent_docs"]
