[project]
name = "myfinance-agent-market"
version = "0.1.0"
description = "Future dated and sourced market-context agent for banks."
requires-python = ">=3.12"
dependencies = ["fastapi>=0.115", "uvicorn[standard]>=0.30"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/myfinance_agent_market"]
