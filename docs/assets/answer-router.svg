<svg width="1200" height="450" viewBox="0 0 1200 450" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">MyFinance answer router</title><desc id="desc">A visual decision path from a message to a validated value, documentary answer, market response or clarification.</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1200" y2="450" gradientUnits="userSpaceOnUse"><stop stop-color="#F8FBF8"/><stop offset="1" stop-color="#E8F1EC"/></linearGradient><filter id="s" x="-20" y="-20" width="1240" height="490" filterUnits="userSpaceOnUse"><feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#133B35" flood-opacity="0.11"/></filter></defs>
  <rect width="1200" height="450" rx="18" fill="url(#bg)"/>
  <text x="60" y="60" fill="#0F4541" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" letter-spacing="2.1">MYFINANCE / ANSWER ROUTER</text>
  <text x="60" y="99" fill="#153836" font-family="Arial, Helvetica, sans-serif" font-size="29" font-weight="700">One request. Four explicit outcomes.</text>
  <text x="60" y="126" fill="#62817A" font-family="Arial, Helvetica, sans-serif" font-size="14">The route is chosen by scope and evidence, not by what sounds most confident.</text>
  <g filter="url(#s)">
    <rect x="60" y="170" width="195" height="82" rx="14" fill="#123E3C"/><text x="82" y="202" fill="#D7FF64" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="700" letter-spacing="1.2">INPUT</text><text x="82" y="229" fill="#F4F9F4" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700">User message</text>
    <rect x="344" y="170" width="224" height="82" rx="14" fill="white" stroke="#C6D8D0"/><text x="366" y="202" fill="#168261" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="700" letter-spacing="1.2">ASSESS</text><text x="366" y="229" fill="#163F3D" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700">Bank · year · metric</text>
    <rect x="657" y="170" width="224" height="82" rx="14" fill="#D7FF64"/><text x="679" y="202" fill="#143E3D" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="700" letter-spacing="1.2">SAFE DECISION</text><text x="679" y="229" fill="#143E3D" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700">Evidence route</text>
  </g>
  <path d="M255 211H326M568 211H639" stroke="#168261" stroke-width="3"/><path d="M318 205L330 211L318 217M631 205L643 211L631 217" stroke="#168261" stroke-width="3"/>
  <path d="M769 252V286M241 286H1050" stroke="#70BDA0" stroke-width="2" stroke-dasharray="5 5"/>
  <g filter="url(#s)">
    <rect x="60" y="306" width="222" height="92" rx="14" fill="white" stroke="#C6D8D0"/><text x="82" y="335" fill="#168261" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="700" letter-spacing="1.1">VALIDATED FACT</text><text x="82" y="361" fill="#163F3D" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700">Numeric value</text><text x="82" y="381" fill="#64817A" font-family="Arial, Helvetica, sans-serif" font-size="11">PDF page + excerpt</text>
    <rect x="326" y="306" width="222" height="92" rx="14" fill="white" stroke="#C6D8D0"/><text x="348" y="335" fill="#168261" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="700" letter-spacing="1.1">EVIDENCE CORPUS</text><text x="348" y="361" fill="#163F3D" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700">Documentary answer</text><text x="348" y="381" fill="#64817A" font-family="Arial, Helvetica, sans-serif" font-size="11">page-level citations</text>
    <rect x="592" y="306" width="222" height="92" rx="14" fill="white" stroke="#C6D8D0"/><text x="614" y="335" fill="#168261" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="700" letter-spacing="1.1">MARKET WATCH</text><text x="614" y="361" fill="#163F3D" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700">Current quote</text><text x="614" y="381" fill="#64817A" font-family="Arial, Helvetica, sans-serif" font-size="11">capture time + source</text>
    <rect x="858" y="306" width="282" height="92" rx="14" fill="#123E3C"/><text x="880" y="335" fill="#D7FF64" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="700" letter-spacing="1.1">SAFE FALLBACK</text><text x="880" y="361" fill="#F4F9F4" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700">Clarification or refusal</text><text x="880" y="381" fill="#B8D1C8" font-family="Arial, Helvetica, sans-serif" font-size="11">missing scope never becomes a guess</text>
  </g>
</svg>
