<svg width="1200" height="500" viewBox="0 0 1200 500" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">MyFinance system architecture</title>
  <desc id="desc">A clear map of the Chat, Testing Lab, evidence services and optional providers.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="500" gradientUnits="userSpaceOnUse"><stop stop-color="#F8FBF8"/><stop offset="1" stop-color="#E8F1EC"/></linearGradient>
    <filter id="s" x="-20" y="-20" width="1240" height="540" filterUnits="userSpaceOnUse"><feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#133B35" flood-opacity="0.11"/></filter>
    <pattern id="g" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" stroke="#143E3D" stroke-opacity="0.06"/></pattern>
  </defs>
  <rect width="1200" height="500" rx="18" fill="url(#bg)"/><rect width="1200" height="500" rx="18" fill="url(#g)"/>
  <text x="60" y="60" fill="#0F4541" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" letter-spacing="2.1">MYFINANCE / SYSTEM MAP</text>
  <text x="60" y="99" fill="#153836" font-family="Arial, Helvetica, sans-serif" font-size="29" font-weight="700">Two product surfaces. One controlled evidence core.</text>
  <text x="60" y="126" fill="#62817A" font-family="Arial, Helvetica, sans-serif" font-size="14">The Chat answers. The Testing Lab independently observes and verifies.</text>

  <g filter="url(#s)">
    <rect x="60" y="176" width="198" height="76" rx="13" fill="white" stroke="#C6D8D0"/>
    <text x="82" y="207" fill="#168261" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="700" letter-spacing="1.3">USER EXPERIENCE</text>
    <text x="82" y="231" fill="#163F3D" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700">Chat Web</text>

    <rect x="60" y="278" width="198" height="76" rx="13" fill="white" stroke="#C6D8D0"/>
    <text x="82" y="309" fill="#168261" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="700" letter-spacing="1.3">QUALITY EXPERIENCE</text>
    <text x="82" y="333" fill="#163F3D" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700">Testing Web</text>

    <rect x="348" y="176" width="215" height="76" rx="13" fill="#123E3C"/>
    <text x="370" y="207" fill="#D7FF64" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="700" letter-spacing="1.3">CONVERSATION CORE</text>
    <text x="370" y="231" fill="#F4F9F4" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700">Chat API</text>

    <rect x="348" y="278" width="215" height="76" rx="13" fill="#123E3C"/>
    <text x="370" y="309" fill="#D7FF64" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="700" letter-spacing="1.3">CAMPAIGN CORE</text>
    <text x="370" y="333" fill="#F4F9F4" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700">Testing API</text>

    <rect x="656" y="156" width="224" height="94" rx="14" fill="#D7FF64"/>
    <text x="678" y="186" fill="#143E3D" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="700" letter-spacing="1.3">SOURCE OF TRUTH</text>
    <text x="678" y="211" fill="#143E3D" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700">Validated facts</text>
    <text x="678" y="230" fill="#315852" font-family="Arial, Helvetica, sans-serif" font-size="11">official PDF evidence</text>

    <rect x="656" y="278" width="224" height="94" rx="14" fill="white" stroke="#C6D8D0"/>
    <text x="678" y="308" fill="#168261" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="700" letter-spacing="1.3">DOCUMENTARY EVIDENCE</text>
    <text x="678" y="333" fill="#163F3D" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700">Page-level corpus</text>
    <text x="678" y="352" fill="#64817A" font-family="Arial, Helvetica, sans-serif" font-size="11">lexical retrieval always works</text>

    <rect x="973" y="156" width="167" height="94" rx="14" fill="white" stroke="#C6D8D0"/>
    <text x="993" y="187" fill="#168261" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="700" letter-spacing="1.1">OPTIONAL RAG</text>
    <text x="993" y="212" fill="#163F3D" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700">Qdrant</text>
    <text x="993" y="231" fill="#64817A" font-family="Arial, Helvetica, sans-serif" font-size="11">+ local Ollama</text>

    <rect x="973" y="278" width="167" height="94" rx="14" fill="white" stroke="#C6D8D0"/>
    <text x="993" y="309" fill="#168261" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="700" letter-spacing="1.1">MARKET DATA</text>
    <text x="993" y="334" fill="#163F3D" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700">Market Watch</text>
    <text x="993" y="353" fill="#64817A" font-family="Arial, Helvetica, sans-serif" font-size="11">dated snapshots</text>
  </g>

  <path d="M258 214H328M258 316H328M563 214H636M563 316H636M880 203H953M880 325H953" stroke="#168261" stroke-width="3"/>
  <path d="M320 208L332 214L320 220M320 310L332 316L320 322M628 208L640 214L628 220M628 310L640 316L628 322M945 197L957 203L945 209M945 319L957 325L945 331" stroke="#168261" stroke-width="3"/>
  <path d="M456 252V270" stroke="#70BDA0" stroke-width="2" stroke-dasharray="4 5"/>
  <text x="60" y="443" fill="#55776F" font-family="Arial, Helvetica, sans-serif" font-size="12">Groq can assist grounded wording, exploration and critique. It never becomes the authority for a financial number.</text>
</svg>
