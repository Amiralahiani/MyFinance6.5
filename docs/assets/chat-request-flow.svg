<svg width="1200" height="430" viewBox="0 0 1200 430" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">MyFinance Chat request flow</title><desc id="desc">A typed Chat request moves from input through deterministic assessment and evidence services to a source-backed response and retained safe context.</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1200" y2="430" gradientUnits="userSpaceOnUse"><stop stop-color="#F8FBF8"/><stop offset="1" stop-color="#E8F1EC"/></linearGradient><filter id="s" x="-20" y="-20" width="1240" height="470" filterUnits="userSpaceOnUse"><feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#133B35" flood-opacity="0.11"/></filter></defs>
  <rect width="1200" height="430" rx="18" fill="url(#bg)"/>
  <text x="60" y="60" fill="#0F4541" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" letter-spacing="2.1">MYFINANCE / CHAT REQUEST FLOW</text>
  <text x="60" y="99" fill="#153836" font-family="Arial, Helvetica, sans-serif" font-size="29" font-weight="700">The API returns a typed answer and only safe context.</text>
  <text x="60" y="126" fill="#62817A" font-family="Arial, Helvetica, sans-serif" font-size="14">The web interface and the Testing Lab call the same guarded endpoint.</text>
  <g filter="url(#s)">
    <rect x="60" y="185" width="178" height="98" rx="14" fill="#123E3C"/><text x="82" y="216" fill="#D7FF64" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="700" letter-spacing="1.1">REQUEST</text><text x="82" y="244" fill="#F4F9F4" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700">Web or executor</text><text x="82" y="265" fill="#B8D1C8" font-family="Arial, Helvetica, sans-serif" font-size="11">message + safe context</text>
    <rect x="292" y="185" width="196" height="98" rx="14" fill="white" stroke="#C6D8D0"/><text x="314" y="216" fill="#168261" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="700" letter-spacing="1.1">ASSESSMENT</text><text x="314" y="244" fill="#163F3D" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700">Chat API</text><text x="314" y="265" fill="#64817A" font-family="Arial, Helvetica, sans-serif" font-size="11">bank · year · metric · gaps</text>
    <rect x="542" y="185" width="224" height="98" rx="14" fill="#D7FF64"/><text x="564" y="216" fill="#143E3D" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="700" letter-spacing="1.1">EVIDENCE SERVICES</text><text x="564" y="244" fill="#143E3D" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700">Facts · corpus · market</text><text x="564" y="265" fill="#315852" font-family="Arial, Helvetica, sans-serif" font-size="11">only approved source paths</text>
    <rect x="820" y="185" width="152" height="98" rx="14" fill="white" stroke="#C6D8D0"/><text x="842" y="216" fill="#168261" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="700" letter-spacing="1.1">RESPONSE</text><text x="842" y="244" fill="#163F3D" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700">Typed answer</text><text x="842" y="265" fill="#64817A" font-family="Arial, Helvetica, sans-serif" font-size="11">evidence or notice</text>
    <rect x="1026" y="185" width="114" height="98" rx="14" fill="#123E3C"/><text x="1048" y="216" fill="#D7FF64" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="700" letter-spacing="1.1">CONTEXT</text><text x="1048" y="244" fill="#F4F9F4" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700">Safe state</text><text x="1048" y="265" fill="#B8D1C8" font-family="Arial, Helvetica, sans-serif" font-size="11">next turn only</text>
  </g>
  <path d="M238 234H274M488 234H524M766 234H802M972 234H1008" stroke="#168261" stroke-width="3"/><path d="M266 228L278 234L266 240M516 228L528 234L516 240M794 228L806 234L794 240M1000 228L1012 234L1000 240" stroke="#168261" stroke-width="3"/>
</svg>
