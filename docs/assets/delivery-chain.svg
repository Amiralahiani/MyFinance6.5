<svg width="1200" height="410" viewBox="0 0 1200 410" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">MyFinance delivery chain</title><desc id="desc">A controlled development chain from official source material to independent product testing.</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1200" y2="410" gradientUnits="userSpaceOnUse"><stop stop-color="#F8FBF8"/><stop offset="1" stop-color="#E8F1EC"/></linearGradient><filter id="s" x="-20" y="-20" width="1240" height="450" filterUnits="userSpaceOnUse"><feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#133B35" flood-opacity="0.11"/></filter></defs>
  <rect width="1200" height="410" rx="18" fill="url(#bg)"/>
  <text x="60" y="60" fill="#0F4541" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" letter-spacing="2.1">MYFINANCE / DELIVERY PRINCIPLE</text>
  <text x="60" y="99" fill="#153836" font-family="Arial, Helvetica, sans-serif" font-size="29" font-weight="700">Each product change keeps evidence in control.</text>
  <text x="60" y="126" fill="#62817A" font-family="Arial, Helvetica, sans-serif" font-size="14">A safe feature moves through explicit, reviewable boundaries before it reaches a user.</text>
  <g filter="url(#s)">
    <rect x="60" y="188" width="185" height="104" rx="14" fill="#123E3C"/><text x="82" y="220" fill="#D7FF64" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="700" letter-spacing="1.1">01 / SOURCE</text><text x="82" y="247" fill="#F4F9F4" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700">Official material</text><text x="82" y="269" fill="#B8D1C8" font-family="Arial, Helvetica, sans-serif" font-size="11">PDFs + market observations</text>
    <rect x="290" y="188" width="185" height="104" rx="14" fill="white" stroke="#C6D8D0"/><text x="312" y="220" fill="#168261" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="700" letter-spacing="1.1">02 / VALIDATE</text><text x="312" y="247" fill="#163F3D" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700">Deterministic checks</text><text x="312" y="269" fill="#64817A" font-family="Arial, Helvetica, sans-serif" font-size="11">scope · unit · provenance</text>
    <rect x="520" y="188" width="185" height="104" rx="14" fill="#D7FF64"/><text x="542" y="220" fill="#143E3D" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="700" letter-spacing="1.1">03 / CONTRACT</text><text x="542" y="247" fill="#143E3D" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700">Typed response</text><text x="542" y="269" fill="#315852" font-family="Arial, Helvetica, sans-serif" font-size="11">one shared product shape</text>
    <rect x="750" y="188" width="185" height="104" rx="14" fill="white" stroke="#C6D8D0"/><text x="772" y="220" fill="#168261" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="700" letter-spacing="1.1">04 / EXPERIENCE</text><text x="772" y="247" fill="#163F3D" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700">Chat interface</text><text x="772" y="269" fill="#64817A" font-family="Arial, Helvetica, sans-serif" font-size="11">evidence visible by design</text>
    <rect x="980" y="188" width="160" height="104" rx="14" fill="#123E3C"/><text x="1002" y="220" fill="#D7FF64" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="700" letter-spacing="1.1">05 / PROVE</text><text x="1002" y="247" fill="#F4F9F4" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700">Testing Lab</text><text x="1002" y="269" fill="#B8D1C8" font-family="Arial, Helvetica, sans-serif" font-size="11">independent checks</text>
  </g>
  <path d="M245 240H272M475 240H502M705 240H732M935 240H962" stroke="#168261" stroke-width="3"/><path d="M264 234L276 240L264 246M494 234L506 240L494 246M724 234L736 240L724 246M954 234L966 240L954 246" stroke="#168261" stroke-width="3"/>
</svg>
