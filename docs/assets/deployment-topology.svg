<svg width="1200" height="405" viewBox="0 0 1200 405" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">MyFinance secure deployment topology</title><desc id="desc">Internet traffic reaches Chat through a secure proxy while Testing and internal data services remain private.</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1200" y2="405" gradientUnits="userSpaceOnUse"><stop stop-color="#103D3B"/><stop offset="1" stop-color="#092426"/></linearGradient><filter id="s" x="-20" y="-20" width="1240" height="445" filterUnits="userSpaceOnUse"><feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#001313" flood-opacity="0.32"/></filter></defs>
  <rect width="1200" height="405" rx="18" fill="url(#bg)"/>
  <text x="60" y="60" fill="#D7FF64" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" letter-spacing="2.1">MYFINANCE / DEPLOYMENT BOUNDARY</text>
  <text x="60" y="99" fill="#F4F9F4" font-family="Arial, Helvetica, sans-serif" font-size="29" font-weight="700">Keep the public Chat and private operations separate.</text>
  <g filter="url(#s)">
    <rect x="60" y="158" width="177" height="93" rx="14" fill="#F5F9F6"/><text x="82" y="188" fill="#168261" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="700" letter-spacing="1.1">PUBLIC</text><text x="82" y="215" fill="#143E3D" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700">Internet user</text>
    <rect x="314" y="158" width="244" height="93" rx="14" fill="#D7FF64"/><text x="336" y="188" fill="#143E3D" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="700" letter-spacing="1.1">SECURITY GATE</text><text x="336" y="215" fill="#143E3D" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700">TLS + SSO + rate limit</text>
    <rect x="635" y="135" width="210" height="72" rx="13" fill="#F5F9F6"/><text x="657" y="164" fill="#168261" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="700" letter-spacing="1.1">PUBLIC CHAT</text><text x="657" y="187" fill="#143E3D" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700">Chat Web + API</text>
    <rect x="635" y="241" width="210" height="72" rx="13" fill="#123E3C" stroke="#5A8278"/><text x="657" y="270" fill="#D7FF64" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="700" letter-spacing="1.1">ADMINISTRATION</text><text x="657" y="293" fill="#F4F9F4" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700">Testing Web + API</text>
    <rect x="922" y="135" width="218" height="178" rx="14" fill="#0B2C2B" stroke="#416A61"/><text x="944" y="166" fill="#D7FF64" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="700" letter-spacing="1.1">PRIVATE SERVICES</text><text x="944" y="199" fill="#F4F9F4" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700">Qdrant</text><text x="944" y="225" fill="#F4F9F4" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700">Ollama</text><text x="944" y="251" fill="#F4F9F4" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700">Playwright viewer</text><text x="944" y="283" fill="#AFC9C1" font-family="Arial, Helvetica, sans-serif" font-size="10">no direct public exposure</text>
  </g>
  <path d="M237 204H294M558 204H615M845 171H902M845 277H902" stroke="#D7FF64" stroke-width="3"/><path d="M286 198L298 204L286 210M607 198L619 204L607 210M894 165L906 171L894 177M894 271L906 277L894 283" stroke="#D7FF64" stroke-width="3"/>
  <path d="M448 251V277H615" stroke="#70BDA0" stroke-width="2" stroke-dasharray="5 5"/>
  <text x="60" y="357" fill="#ABC8BE" font-family="Arial, Helvetica, sans-serif" font-size="12">Testing belongs on an authenticated administration path. Internal data services stay behind the application boundary.</text>
</svg>
