<svg width="1200" height="470" viewBox="0 0 1200 470" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">MyFinance evidence lifecycle</title><desc id="desc">Official PDF flows through provenance, evidence chunks and deterministic validation to approved facts or cited documentary retrieval.</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1200" y2="470" gradientUnits="userSpaceOnUse"><stop stop-color="#F8FBF8"/><stop offset="1" stop-color="#E8F1EC"/></linearGradient><filter id="s" x="-20" y="-20" width="1240" height="510" filterUnits="userSpaceOnUse"><feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#133B35" flood-opacity="0.11"/></filter></defs>
  <rect width="1200" height="470" rx="18" fill="url(#bg)"/>
  <text x="60" y="60" fill="#0F4541" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" letter-spacing="2.1">MYFINANCE / EVIDENCE LIFECYCLE</text>
  <text x="60" y="99" fill="#153836" font-family="Arial, Helvetica, sans-serif" font-size="29" font-weight="700">A number earns the right to be displayed.</text>
  <text x="60" y="126" fill="#62817A" font-family="Arial, Helvetica, sans-serif" font-size="14">The same official PDF supports both approved values and documentary research.</text>
  <g filter="url(#s)">
    <rect x="60" y="179" width="185" height="92" rx="14" fill="white" stroke="#C6D8D0"/><text x="82" y="208" fill="#168261" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="700" letter-spacing="1.1">PRIMARY SOURCE</text><text x="82" y="235" fill="#163F3D" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700">Official PDF</text><text x="82" y="254" fill="#64817A" font-family="Arial, Helvetica, sans-serif" font-size="11">immutable document</text>
    <rect x="314" y="179" width="208" height="92" rx="14" fill="white" stroke="#C6D8D0"/><text x="336" y="208" fill="#168261" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="700" letter-spacing="1.1">PROVENANCE</text><text x="336" y="235" fill="#163F3D" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700">Document record</text><text x="336" y="254" fill="#64817A" font-family="Arial, Helvetica, sans-serif" font-size="11">hash + report identity</text>
    <rect x="591" y="179" width="218" height="92" rx="14" fill="#123E3C"/><text x="613" y="208" fill="#D7FF64" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="700" letter-spacing="1.1">RETRIEVAL UNIT</text><text x="613" y="235" fill="#F4F9F4" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700">Evidence chunk</text><text x="613" y="254" fill="#B8D1C8" font-family="Arial, Helvetica, sans-serif" font-size="11">one source page only</text>
  </g>
  <path d="M245 225H294M522 225H571" stroke="#168261" stroke-width="3"/><path d="M286 219L298 225L286 231M563 219L575 225L563 231" stroke="#168261" stroke-width="3"/>
  <path d="M700 271V306M700 306H422M700 306H935" stroke="#70BDA0" stroke-width="2" stroke-dasharray="5 5"/>
  <g filter="url(#s)">
    <rect x="202" y="327" width="300" height="92" rx="14" fill="#D7FF64"/><text x="224" y="356" fill="#143E3D" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="700" letter-spacing="1.1">DETERMINISTIC VALIDATION</text><text x="224" y="383" fill="#143E3D" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700">Approved financial fact</text><text x="224" y="402" fill="#315852" font-family="Arial, Helvetica, sans-serif" font-size="11">unit · scope · year · excerpt · page</text>
    <rect x="802" y="327" width="300" height="92" rx="14" fill="white" stroke="#C6D8D0"/><text x="824" y="356" fill="#168261" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="700" letter-spacing="1.1">CONTROLLED RETRIEVAL</text><text x="824" y="383" fill="#163F3D" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700">Cited documentary answer</text><text x="824" y="402" fill="#64817A" font-family="Arial, Helvetica, sans-serif" font-size="11">lexical search + optional Qdrant</text>
  </g>
</svg>
