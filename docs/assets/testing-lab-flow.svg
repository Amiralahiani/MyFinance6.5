<svg width="1200" height="440" viewBox="0 0 1200 440" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">MyFinance Agentic Testing workflow</title>
  <desc id="desc">A controlled workflow from scenarios through planning, execution, deterministic evaluation, optional critique and reporting.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1200" y2="440" gradientUnits="userSpaceOnUse"><stop stop-color="#103D3B"/><stop offset="1" stop-color="#092426"/></linearGradient>
    <filter id="shadow" x="-20" y="-20" width="1240" height="480" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB"><feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#001313" flood-opacity="0.32"/></filter>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" stroke="#D5F0E6" stroke-opacity="0.07"/></pattern>
  </defs>
  <rect width="1200" height="440" rx="18" fill="url(#background)"/>
  <rect width="1200" height="440" rx="18" fill="url(#grid)"/>
  <text x="60" y="61" fill="#D7FF64" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" letter-spacing="2.2">MYFINANCE / AGENTIC TESTING LAB</text>
  <text x="60" y="100" fill="#F4F9F4" font-family="Arial, Helvetica, sans-serif" font-size="29" font-weight="700">A controlled loop that proves the product.</text>
  <text x="60" y="128" fill="#ABC8BE" font-family="Arial, Helvetica, sans-serif" font-size="14">AI can explore. Local policy and deterministic evidence decide what counts.</text>

  <g filter="url(#shadow)">
    <g transform="translate(60 184)">
      <rect width="164" height="114" rx="13" fill="#F5F9F6"/>
      <text x="18" y="28" fill="#168261" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="700" letter-spacing="1.5">01 / INPUT</text>
      <text x="18" y="56" fill="#143E3D" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700">Catalogue or</text>
      <text x="18" y="76" fill="#143E3D" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700">AI exploration</text>
      <text x="18" y="98" fill="#64817A" font-family="Arial, Helvetica, sans-serif" font-size="10">risk scenarios</text>
    </g>
    <g transform="translate(260 184)">
      <rect width="164" height="114" rx="13" fill="#F5F9F6"/>
      <text x="18" y="28" fill="#168261" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="700" letter-spacing="1.5">02 / POLICY</text>
      <text x="18" y="56" fill="#143E3D" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700">Planner</text>
      <text x="18" y="78" fill="#64817A" font-family="Arial, Helvetica, sans-serif" font-size="10">authorises safe actions</text>
      <rect x="18" y="89" width="75" height="14" rx="7" fill="#DFF2E8"/>
      <text x="27" y="99" fill="#087653" font-family="Arial, Helvetica, sans-serif" font-size="8" font-weight="700">LOCAL RULES</text>
    </g>
    <g transform="translate(460 184)">
      <rect width="164" height="114" rx="13" fill="#F5F9F6"/>
      <text x="18" y="28" fill="#168261" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="700" letter-spacing="1.5">03 / OBSERVE</text>
      <text x="18" y="56" fill="#143E3D" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700">Executor</text>
      <text x="18" y="78" fill="#64817A" font-family="Arial, Helvetica, sans-serif" font-size="10">real API + Web journey</text>
      <text x="18" y="98" fill="#64817A" font-family="Arial, Helvetica, sans-serif" font-size="10">latency + raw response</text>
    </g>
    <g transform="translate(660 184)">
      <rect width="164" height="114" rx="13" fill="#D7FF64"/>
      <text x="18" y="28" fill="#143E3D" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="700" letter-spacing="1.5">04 / VERIFY</text>
      <text x="18" y="56" fill="#143E3D" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700">Evaluator</text>
      <text x="18" y="78" fill="#315852" font-family="Arial, Helvetica, sans-serif" font-size="10">type, value, year, source</text>
      <text x="18" y="98" fill="#315852" font-family="Arial, Helvetica, sans-serif" font-size="10">deterministic verdict</text>
    </g>
    <g transform="translate(860 184)">
      <rect width="280" height="114" rx="13" fill="#123E3C" stroke="#4F786E"/>
      <text x="18" y="28" fill="#D7FF64" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="700" letter-spacing="1.5">05 / REPORT</text>
      <text x="18" y="56" fill="#F5F9F6" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700">Reporter</text>
      <text x="18" y="78" fill="#AFC9C1" font-family="Arial, Helvetica, sans-serif" font-size="10">JSON · Markdown · HTML audit</text>
      <text x="18" y="98" fill="#AFC9C1" font-family="Arial, Helvetica, sans-serif" font-size="10">partial execution stays visible</text>
    </g>
  </g>

  <path d="M224 241H246M424 241H446M624 241H646M824 241H846" stroke="#D7FF64" stroke-width="3"/>
  <path d="M241 235L251 241L241 247M441 235L451 241L441 247M641 235L651 241L641 247M841 235L851 241L841 247" stroke="#D7FF64" stroke-width="3"/>

  <path d="M742 314V348H1010V314" stroke="#70BDA0" stroke-width="2" stroke-dasharray="5 5"/>
  <rect x="808" y="335" width="271" height="47" rx="10" fill="#0B2B2B" stroke="#3D685E"/>
  <text x="828" y="355" fill="#D7FF64" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="700" letter-spacing="1.2">OPTIONAL AI CRITIC</text>
  <text x="828" y="372" fill="#B4CEC5" font-family="Arial, Helvetica, sans-serif" font-size="10">may request one confirmation pass; never rewrites the verdict</text>
</svg>
