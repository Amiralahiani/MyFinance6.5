<svg width="1200" height="500" viewBox="0 0 1200 500" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">MyFinance trust pipeline</title>
  <desc id="desc">Official PDFs and market data flow through controlled evidence paths to the Chat and independent Testing Lab.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="500" gradientUnits="userSpaceOnUse"><stop stop-color="#F8FBF8"/><stop offset="1" stop-color="#E8F1EC"/></linearGradient>
    <linearGradient id="dark" x1="579" y1="128" x2="1001" y2="363" gradientUnits="userSpaceOnUse"><stop stop-color="#164846"/><stop offset="1" stop-color="#0D302F"/></linearGradient>
    <filter id="shadow" x="-20" y="-20" width="1240" height="540" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB"><feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#153A35" flood-opacity="0.10"/></filter>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse"><path d="M30 0H0V30" stroke="#164846" stroke-opacity="0.06"/></pattern>
  </defs>

  <rect width="1200" height="500" rx="18" fill="url(#bg)"/>
  <rect width="1200" height="500" rx="18" fill="url(#grid)"/>
  <text x="60" y="63" fill="#0F4541" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" letter-spacing="2.2">MYFINANCE / TRUST PIPELINE</text>
  <text x="60" y="102" fill="#153836" font-family="Arial, Helvetica, sans-serif" font-size="29" font-weight="700">Every answer keeps its route back to evidence.</text>
  <text x="60" y="129" fill="#62817A" font-family="Arial, Helvetica, sans-serif" font-size="14">Assistance can improve retrieval or wording. It never replaces validation or provenance.</text>

  <g filter="url(#shadow)">
    <rect x="60" y="184" width="202" height="128" rx="14" fill="white" stroke="#C6D8D0"/>
    <rect x="80" y="205" width="34" height="42" rx="5" fill="#163F3D"/>
    <path d="M105 205V215H114" stroke="#D7FF64" stroke-width="2"/>
    <path d="M88 224H106M88 232H105M88 240H100" stroke="#D7FF64" stroke-width="2"/>
    <text x="130" y="222" fill="#163F3D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700">OFFICIAL</text>
    <text x="130" y="241" fill="#163F3D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700">BANK PDFs</text>
    <text x="80" y="282" fill="#64817A" font-family="Arial, Helvetica, sans-serif" font-size="11">immutable primary source</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="315" y="184" width="218" height="128" rx="14" fill="white" stroke="#C6D8D0"/>
    <circle cx="342" cy="226" r="18" fill="#E0F3E7"/>
    <path d="M334 226H350M342 218V234" stroke="#168261" stroke-width="2.4"/>
    <text x="376" y="221" fill="#163F3D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700">PAGE-LEVEL</text>
    <text x="376" y="240" fill="#163F3D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700">EVIDENCE CORPUS</text>
    <text x="335" y="282" fill="#64817A" font-family="Arial, Helvetica, sans-serif" font-size="11">page · bank · year · PDF hash</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="586" y="163" width="266" height="170" rx="16" fill="url(#dark)"/>
    <rect x="606" y="183" width="105" height="26" rx="13" fill="#D7FF64"/>
    <text x="620" y="201" fill="#143E3D" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="700" letter-spacing="1.1">CONTROL LAYER</text>
    <text x="606" y="238" fill="#F4F9F4" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700">Validated facts</text>
    <text x="606" y="261" fill="#BBD3CB" font-family="Arial, Helvetica, sans-serif" font-size="12">deterministic metric checks</text>
    <path d="M606 284H831" stroke="#557B70"/>
    <text x="606" y="307" fill="#D7FF64" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="700">LEXICAL + OPTIONAL QDRANT</text>
    <text x="606" y="326" fill="#BBD3CB" font-family="Arial, Helvetica, sans-serif" font-size="11">retrieval still preserves provenance</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="906" y="184" width="234" height="128" rx="14" fill="white" stroke="#C6D8D0"/>
    <rect x="927" y="207" width="42" height="34" rx="7" fill="#D7FF64"/>
    <path d="M938 221H958M938 229H951" stroke="#143E3D" stroke-width="2"/>
    <text x="986" y="222" fill="#163F3D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700">TYPED CHAT</text>
    <text x="986" y="241" fill="#163F3D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700">ANSWER</text>
    <text x="927" y="282" fill="#64817A" font-family="Arial, Helvetica, sans-serif" font-size="11">value, citation or clarification</text>
  </g>

  <path d="M262 248H299" stroke="#168261" stroke-width="3"/>
  <path d="M294 242L304 248L294 254" stroke="#168261" stroke-width="3"/>
  <path d="M533 248H570" stroke="#168261" stroke-width="3"/>
  <path d="M565 242L575 248L565 254" stroke="#168261" stroke-width="3"/>
  <path d="M852 248H890" stroke="#168261" stroke-width="3"/>
  <path d="M885 242L895 248L885 254" stroke="#168261" stroke-width="3"/>

  <g transform="translate(60 365)">
    <rect width="1080" height="77" rx="13" fill="#113C3A"/>
    <circle cx="29" cy="38" r="15" fill="#D7FF64"/>
    <path d="M22 38L27 43L36 33" stroke="#143E3D" stroke-width="2.5"/>
    <text x="62" y="31" fill="#F3F8F4" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700">INDEPENDENT PRODUCT PROOF</text>
    <text x="62" y="53" fill="#B7D1C8" font-family="Arial, Helvetica, sans-serif" font-size="12">The Agentic Testing Lab replays API and Web journeys, then records deterministic verdicts and visible evidence.</text>
    <text x="921" y="45" fill="#D7FF64" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="700" letter-spacing="1.2">API + WEB + PLAYWRIGHT</text>
  </g>
</svg>
